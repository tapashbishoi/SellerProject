services:
  - type: web
    name: seller-agent
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEYS
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_QUEUE
        value: order_staging
      - key: GEMINI_API_KEY
        sync: false
      - key: PRICE_FLOOR_PCT
        value: "0.70"
      - key: PRICE_HARD_REJECT_PCT
        value: "0.60"
